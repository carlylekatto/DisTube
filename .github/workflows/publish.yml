name: Publish distube
on:
  # A tag is the trigger of a release: the workflow publishes the version and
  # creates the release of it.
  push:
    tags: ["*"]
  # A release that was created by hand publishes the version too.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version right away instead of waiting for an approval"
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # The trusted publishing needs the npm client 11.5.1 or later. The one
      # that comes with Node is old enough on some patches.
      - name: Update the npm client
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The publish runs the prepublishOnly script, which lints the code and
      # runs the tests, and the prepack script, which builds the package.
      #
      # A version that is already on npm, or that is already staged, has
      # nothing left to publish.
      - name: Check the version
        id: version
        run: |
          version=$(npm pkg get version | tr -d '"')
          if [ "${{ github.event_name }}" = "push" ] && [ "$version" != "${{ github.ref_name }}" ]; then
            echo "The tag is ${{ github.ref_name }} and the version is $version."
            exit 1
          fi
          if npm view "@kattowo/distube@$version" version > /dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "the version $version is already on npm"
          elif npm stage list "@kattowo/distube" | grep -q "$version"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "the version $version is already staged"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # The version is staged by default: it waits for an approval with the
      # two factor authentication of the account before it becomes public.
      - name: Stage the version
        if: steps.version.outputs.published == 'true' && inputs.publish != true
        run: npm stage publish --access public

      - name: Publish
        if: steps.version.outputs.published == 'true' && inputs.publish == true
        run: npm publish --access public

      # The release of the version, with the notes of the changelog. The token
      # of the workflow is enough, the release is in the same repository.
      - name: Create the release
        if: steps.version.outputs.published == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(npm pkg get version | tr -d '"')
          gh release create "$version" \
            --title "$version" \
            --notes "$(node scripts/release-notes.mjs "$version")"
