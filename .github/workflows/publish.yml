name: Publish distube
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # The trusted publishing needs the npm client 11.5.1 or later. The one
      # that comes with Node is old enough on some patches.
      - name: Update the npm client
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The publish runs the prepublishOnly script, which lints the code and
      # runs the tests, and the prepack script, which builds the package.
      #
      # The first version is published by hand, since npm wants the package to
      # exist before it accepts a trusted publisher. A release of a version
      # that is already on npm has nothing left to publish.
      - name: Check the version
        id: version
        run: |
          version=$(npm pkg get version | tr -d '"')
          if npm view "@kattowo/distube@$version" version > /dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "the version $version is already on npm"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.published == 'true'
        run: npm publish --access public
