name: Publish distube
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # The trusted publishing needs the npm client 11.5.1 or later. The one
      # that comes with Node is old enough on some patches.
      - name: Update the npm client
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The publish runs the prepublishOnly script, which lints the code and
      # runs the tests, and the prepack script, which builds the package.
      - name: Publish
        run: npm publish --access public
